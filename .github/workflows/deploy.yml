name: Deploy Kyron Realty AI to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Enforces the Agora-only voice policy in docs/built-systems/voice-agent-and-agora.md.
      # Documentation is advisory; this step is not.
      - name: Enforce Agora-only policy
        run: |
          if grep -rnE "speechSynthesis|webkitSpeechRecognition|SpeechRecognition" src/; then
            echo "::error::Browser speech API found. Voice must run exclusively on Agora SD-RTN — see docs/built-systems/voice-agent-and-agora.md"
            exit 1
          fi
          echo "OK: no browser speech APIs in src/"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      # Lint and unused-code checks run before the build so a rule violation fails fast.
      - name: Lint
        run: npm run lint

      - name: Unused exports and dependencies
        run: npm run lint:unused

      - name: Type Check & Build Test
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Deployment on VPS via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          debug: true
          script: |
            set -e
            cd /var/www/egnitech.com/html/wp-content/projects/kyron-realty-ai
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
